<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Consulta de notas — Redes</title>
  <style>
    body {font: 1rem system-ui; max-width: 48rem; margin: 3rem auto; padding: 0 1rem;}
    table {border-collapse: collapse; width: 100%;} th,td {padding: .6rem; text-align: left; border-bottom: 1px solid #ddd;}
  </style>
</head>
<body>
  <h1>Consulta de notas</h1>
  <p id="status" role="status">Carregando…</p>
  <table aria-label="Notas"><tbody id="notas"></tbody></table>
  <script>
    async function main() {
      const params = new URLSearchParams(location.search);
      const fragment = new URLSearchParams(location.hash.slice(1));
      const token = fragment.get('token') || params.get('token');
      // Links sem período já emitidos pela versão hoje publicada pertencem a 2026-1.
      // Esse padrão é fixo: jamais substituir pelo semestre corrente.
      const periodo = params.get('periodo') || '2026-1';
      if (!token) throw new Error('Use o link privado fornecido pelo professor.');
      if (!/^\d{4}-[12]$/.test(periodo)) throw new Error('Período inválido.');
      const response = await fetch('/periodos.json', {cache: 'no-cache'});
      if (!response.ok) throw new Error('Não foi possível carregar a lista de períodos.');
      const manifest = await response.json();
      const api = manifest.periodos?.[periodo]?.app_script_url;
      if (!api) throw new Error(`A consulta de ${periodo} ainda não está disponível.`);
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(api)) throw new Error('Endereço de consulta inválido.');
      const url = new URL(api); url.searchParams.set('token', token);
      const result = await fetch(url, {cache: 'no-store', credentials: 'omit', redirect: 'follow'});
      if (!result.ok) throw new Error('Não foi possível consultar as notas agora.');
      const rows = await result.json();
      if (!Array.isArray(rows)) throw new Error('Resposta inesperada da consulta.');
      if (!rows.length) throw new Error('Link inválido ou pertencente a outro período.');
      const body = document.getElementById('notas');
      for (const {key, value} of rows) {
        const tr = document.createElement('tr');
        const th = document.createElement('th'); th.scope = 'row'; th.textContent = key;
        const td = document.createElement('td'); td.textContent = value;
        tr.append(th, td); body.append(tr);
      }
      document.getElementById('status').textContent = `Período letivo: ${periodo}`;
    }
    main().catch(err => {document.getElementById('status').textContent = err.message;});
  </script>
</body>
</html>
